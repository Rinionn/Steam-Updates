name: Steam Event Radar - GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - data/events.json
      - data/changelog.json
      - data/news.json
      - index.html
  workflow_dispatch:
  schedule:
    # Her 10 dakikada bir; saat başı GitHub Actions yoğunluğundan kaçınır.
    - cron: "5,15,25,35,45,55 * * * *"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.deploy-decision.outputs.should_deploy }}
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v6

      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Bagimliliklari kur
        run: npm ci --ignore-scripts

      - name: Steam takvimini guncelle
        id: steam-sync
        continue-on-error: true
        run: npm run sync

      - name: Steam sync hatasi icin issue ac
        if: steps.steam-sync.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Steam etkinlik senkronizasyonu başarısız";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const duplicate = issues.some(
              (issue) => !issue.pull_request && issue.title === title,
            );
            if (!duplicate) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  "Steamworks takvim senkronizasyonu başarısız oldu.",
                  "",
                  `Workflow: ${context.workflow}`,
                  `Çalışma: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  `Commit: ${context.sha}`,
                  "",
                  "Son başarılı GitHub Pages sürümü yayında kalmaya devam ediyor.",
                ].join("\n"),
              });
            }

      - name: Steam sync hatasini build'e yansit
        if: steps.steam-sync.outcome == 'failure'
        run: exit 1

      - name: Steam anlik goruntusunu kaydet
        id: data-commit
        shell: bash
        run: |
          git add data/events.json data/changelog.json data/news.json index.html
          if git diff --cached --quiet; then
            echo "Steam anlik goruntusunde degisiklik yok."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): steam takvimi guncellendi [skip ci]"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Yayin gereksinimini belirle
        id: deploy-decision
        shell: bash
        env:
          DATA_CHANGED: ${{ steps.data-commit.outputs.changed }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] || [ "$DATA_CHANGED" = "true" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Veri degismedi; Worker ve Pages yayini atlandi."
          fi

      - name: D1 ekip veritabanini hazirla
        if: vars.CLOUDFLARE_ENABLED == 'true' && github.event_name != 'schedule'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const databaseName = "steam-etkinlik-radari";
          const endpoint =
            `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database`;
          const headers = {
            authorization: `Bearer ${token}`,
            "content-type": "application/json",
          };

          async function cloudflare(url, options = {}) {
            const response = await fetch(url, { ...options, headers });
            const body = await response.json();
            if (!response.ok || body.success !== true) {
              const errors = (body.errors || [])
                .map((error) => `${error.code || "?"}: ${error.message || error}`)
                .join("; ");
              throw new Error(errors || `Cloudflare API ${response.status}`);
            }
            return body.result;
          }

          try {
            const databases = await cloudflare(
              `${endpoint}?name=${encodeURIComponent(databaseName)}`,
            );
            let database = Array.isArray(databases)
              ? databases.find((item) => item.name === databaseName)
              : null;
            if (!database) {
              database = await cloudflare(endpoint, {
                method: "POST",
                body: JSON.stringify({ name: databaseName }),
              });
            }
            const configPath = "wrangler.jsonc";
            const config = JSON.parse(await readFile(configPath, "utf8"));
            config.d1_databases = [
              {
                binding: "DB",
                database_name: databaseName,
                database_id: database.uuid,
              },
            ];
            await writeFile(configPath, `${JSON.stringify(config, null, 2)}\n`);
            console.log(`D1 hazir: ${databaseName}`);
          } catch (error) {
            console.error(`::error::D1 hazirlanamadi: ${error.message}`);
            process.exitCode = 1;
          }
          NODE

      - name: D1 ekip veritabani semasini uygula
        if: vars.CLOUDFLARE_ENABLED == 'true' && github.event_name != 'schedule'
        run: npx wrangler@4 d1 execute DB --remote --file=./db/schema.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Cloudflare Worker ve paneli yayinla
        if: vars.CLOUDFLARE_ENABLED == 'true' && steps.deploy-decision.outputs.should_deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"

      - name: Gamalytic API anahtarini Worker'a tanimla
        if: vars.CLOUDFLARE_ENABLED == 'true' && github.event_name != 'schedule'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GAMALYTIC_API_KEY: ${{ secrets.GAMALYTIC_API_KEY }}
        run: |
          if [ -z "$GAMALYTIC_API_KEY" ]; then
            echo "GAMALYTIC_API_KEY tanimli degil; entegrasyon atlandi."
            exit 0
          fi
          printf '%s' "$GAMALYTIC_API_KEY" | npx wrangler@4 secret put GAMALYTIC_API_KEY

      - name: Yonetim paneli sifresini Worker'a tanimla
        if: vars.CLOUDFLARE_ENABLED == 'true' && github.event_name != 'schedule'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PANEL_PASSWORD: ${{ secrets.ADMIN_PANEL_PASSWORD }}
        run: |
          if [ -z "$ADMIN_PANEL_PASSWORD" ]; then
            echo "ADMIN_PANEL_PASSWORD tanimli degil; yonetim paneli sifreyle acilmayacak."
            exit 0
          fi
          printf '%s' "$ADMIN_PANEL_PASSWORD" | npx wrangler@4 secret put ADMIN_PANEL_PASSWORD

      - name: E-posta otomasyon anahtarini Worker'a tanimla
        if: vars.CLOUDFLARE_ENABLED == 'true' && github.event_name != 'schedule'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMAIL_AUTOMATION_SECRET: ${{ secrets.EMAIL_AUTOMATION_SECRET }}
        run: |
          if [ -z "$EMAIL_AUTOMATION_SECRET" ]; then
            echo "EMAIL_AUTOMATION_SECRET tanimli degil; panel alicilari statik listeyle birlestirilmeyecek."
            exit 0
          fi
          printf '%s' "$EMAIL_AUTOMATION_SECRET" | npx wrangler@4 secret put EMAIL_AUTOMATION_SECRET

      - name: Otomatik olusturulan D1 baglantisini kaydet
        if: vars.CLOUDFLARE_ENABLED == 'true' && github.event_name != 'schedule'
        shell: bash
        run: |
          git add wrangler.jsonc
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(cloudflare): D1 baglantisi kaydedildi [skip ci]"
          git push origin HEAD:main

      - name: GitHub Pages'i hazirla
        if: steps.deploy-decision.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Site dosyalarini yukle
        if: steps.deploy-decision.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages'e yayinla
        id: deployment
        uses: actions/deploy-pages@v4
