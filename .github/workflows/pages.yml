name: Steam Event Radar - GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - data/events.json
  workflow_dispatch:
  schedule:
    # 09:00 Europe/Istanbul (UTC+3)
    - cron: "0 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v6

      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Bagimliliklari kur
        run: npm ci --ignore-scripts

      - name: Steam takvimini guncelle
        run: npm run sync

      - name: Steam anlik goruntusunu kaydet
        shell: bash
        run: |
          git add data/events.json
          if git diff --cached --quiet; then
            echo "Steam anlik goruntusunde degisiklik yok."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): steam takvimi guncellendi"
          git push origin HEAD:main

      - name: GitHub Pages'i hazirla
        uses: actions/configure-pages@v5

      - name: Site dosyalarini yukle
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages'e yayinla
        id: deployment
        uses: actions/deploy-pages@v4
