name: Steam Event Radar - GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - data/events.json
      - data/changelog.json
      - index.html
  workflow_dispatch:
  schedule:
    # 09:00 Europe/Istanbul (UTC+3)
    - cron: "0 6 * * *"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v6

      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Bagimliliklari kur
        run: npm ci --ignore-scripts

      - name: Steam takvimini guncelle
        id: steam-sync
        continue-on-error: true
        run: npm run sync

      - name: Steam sync hatasi icin issue ac
        if: steps.steam-sync.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Steam etkinlik senkronizasyonu başarısız";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const duplicate = issues.some(
              (issue) => !issue.pull_request && issue.title === title,
            );
            if (!duplicate) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  "Steamworks takvim senkronizasyonu başarısız oldu.",
                  "",
                  `Workflow: ${context.workflow}`,
                  `Çalışma: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  `Commit: ${context.sha}`,
                  "",
                  "Son başarılı GitHub Pages sürümü yayında kalmaya devam ediyor.",
                ].join("\n"),
              });
            }

      - name: Steam sync hatasini build'e yansit
        if: steps.steam-sync.outcome == 'failure'
        run: exit 1

      - name: Steam anlik goruntusunu kaydet
        shell: bash
        run: |
          git add data/events.json data/changelog.json index.html
          if git diff --cached --quiet; then
            echo "Steam anlik goruntusunde degisiklik yok."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): steam takvimi guncellendi"
          git push origin HEAD:main

      - name: Cloudflare Worker ve paneli yayinla
        if: vars.CLOUDFLARE_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"

      - name: D1 ekip veritabani semasini uygula
        if: vars.CLOUDFLARE_ENABLED == 'true'
        run: npx wrangler@4 d1 execute DB --remote --file=./db/schema.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Otomatik olusturulan D1 baglantisini kaydet
        if: vars.CLOUDFLARE_ENABLED == 'true'
        shell: bash
        run: |
          git add wrangler.jsonc
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(cloudflare): D1 baglantisi kaydedildi [skip ci]"
          git push origin HEAD:main

      - name: GitHub Pages'i hazirla
        uses: actions/configure-pages@v5

      - name: Site dosyalarini yukle
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages'e yayinla
        id: deployment
        uses: actions/deploy-pages@v4
