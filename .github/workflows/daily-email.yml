name: Steam Event Radar - Daily Email

on:
  workflow_dispatch:
    inputs:
      force_send:
        description: Planlanan saati ve günlük gönderim kaydını atla
        required: false
        type: boolean
        default: false
  schedule:
    # Panelde seçilen Europe/Istanbul saatini yarım saatte bir kontrol eder.
    - cron: "0,30 * * * *"

permissions:
  contents: read

concurrency:
  group: daily-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TIMEZONE: Europe/Istanbul
      EMAIL_DAILY: "true"
      EMAIL_SEND_TIME: "09:30"
      EMAIL_LOOKAHEAD_DAYS: "90"
      EMAIL_TO: business.dev@gaminginturkey.com
      EMAIL_BCC: batuhan.ozmen@gaminginturkey.com, pinargulerrrr@gmail.com
      EMAIL_FROM: "Steam Etkinlik Radarı <batuhan.ozmen@gaminginturkey.com>"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "465"
      SMTP_SECURE: "true"
      SMTP_USER: batuhan.ozmen@gaminginturkey.com
      SMTP_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_RECIPIENT_API_URL: https://steam-etkinlik-radari.batuhan-ozmen.workers.dev/api/automation/email-recipients
      EMAIL_AUTOMATION_SECRET: ${{ secrets.EMAIL_AUTOMATION_SECRET }}

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v6

      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Bagimliliklari kur
        run: npm ci --ignore-scripts

      - name: E-posta kimligini kontrol et
        shell: bash
        run: |
          if [ -z "$SMTP_PASS" ]; then
            echo "::error::GMAIL_APP_PASSWORD repository secret'i ayarlanmamis."
            exit 1
          fi

      - name: Gunluk ozeti gonder
        shell: bash
        run: |
          if [ "${{ inputs.force_send || false }}" = "true" ]; then
            npm run email -- --force-email
          else
            npm run email
          fi
