name: Steam Radar - Daily Email

on:
  workflow_dispatch:
    inputs:
      force_send:
        description: Planlanan saati ve günlük gönderim kaydını atla
        required: false
        type: boolean
        default: false
  schedule:
    # Panelde seçilen Europe/Istanbul saatini yarım saatte bir kontrol eder.
    - cron: "0,30 * * * *"

permissions:
  contents: read

concurrency:
  group: daily-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TIMEZONE: Europe/Istanbul
      EMAIL_DAILY: "true"
      EMAIL_SEND_TIME: "09:30"
      EMAIL_LOOKAHEAD_DAYS: "90"
      EMAIL_TO: business.dev@gaminginturkey.com
      EMAIL_BCC: batuhan.ozmen@gaminginturkey.com, pinargulerrrr@gmail.com
      EMAIL_FROM: "Steam Radar <batuhan.ozmen@gaminginturkey.com>"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "465"
      SMTP_SECURE: "true"
      SMTP_USER: batuhan.ozmen@gaminginturkey.com
      SMTP_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EMAIL_RECIPIENT_API_URL: https://steam-etkinlik-radari.batuhan-ozmen.workers.dev/api/automation/email-recipients
      EMAIL_AUTOMATION_SECRET: ${{ secrets.EMAIL_AUTOMATION_SECRET }}

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v6

      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Bagimliliklari kur
        run: npm ci --ignore-scripts

      - name: D1 e-posta ayarlarini bagla
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";

          const wrangler = JSON.parse(await readFile("wrangler.jsonc", "utf8"));
          const databaseId = wrangler.d1_databases?.find(
            (database) => database.binding === "DB",
          )?.database_id;
          if (!databaseId) {
            throw new Error("wrangler.jsonc içinde DB database_id bulunamadı.");
          }
          await appendFile(
            process.env.GITHUB_ENV,
            `CLOUDFLARE_D1_DATABASE_ID=${databaseId}\n`,
          );
          console.log("Yönetim panelindeki D1 e-posta ayarları bağlandı.");
          NODE

      - name: E-posta kimligini kontrol et
        shell: bash
        run: |
          if [ -z "$SMTP_PASS" ]; then
            echo "::error::GMAIL_APP_PASSWORD repository secret'i ayarlanmamis."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID veya CLOUDFLARE_API_TOKEN tanımlı değil; panel ayarları okunamaz."
            exit 1
          fi

      - name: Gunluk ozeti gonder
        shell: bash
        run: |
          if [ "${{ inputs.force_send || false }}" = "true" ]; then
            npm run email -- --force-email
          else
            npm run email
          fi
